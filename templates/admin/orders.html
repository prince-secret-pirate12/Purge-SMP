{% extends 'admin/base.html' %}{% block content %}<h1>Orders</h1><form class="filters"><input name="q" value="{{request.args.get('q','')}}" placeholder="Username, UTR or rank"><select name="status"><option value="">All statuses</option>{% for s in ['Pending Verification','Approved','Rejected'] %}<option {% if request.args.get('status')==s %}selected{% endif %}>{{s}}</option>{% endfor %}</select><button class="btn">Search</button></form><div class="panel tablewrap"><table><tr><th>ID</th><th>Player</th><th>Rank</th><th>Price</th><th>UTR</th><th>Date</th><th>Status</th><th></th></tr>{% for o in orders %}<tr><td>#{{o.id}}</td><td>{{o.user.minecraft_username}}</td><td>{{o.rank.name}}</td><td>₹{{o.amount}}</td><td>{{o.utr}}</td><td>{{o.created_at.strftime('%d %b %H:%M')}}</td><td>{{o.payment_status}}</td><td><a href="{{url_for('admin_order',oid=o.id)}}">View</a></td></tr>{% endfor %}</table></div>{% endblock %}
